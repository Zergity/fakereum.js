# Fakereum — Cloudflare Worker (Free-plan compatible).
#
# Architecture: a thin front Worker (this `main`) forwards essentially all work
# to a single SQLite-backed Durable Object per sandbox chain id. The EVM runs
# *inside* the DO, which gets a 30s CPU budget on every plan (including Free);
# a plain Worker request on Free is capped at 10ms, far too little for the EVM.
name = "fakereum"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# One Durable Object class = the stateful sandbox "node".
[[durable_objects.bindings]]
name = "EVM_SANDBOX"
class_name = "EvmSandbox"

# SQLite storage backend -> required for, and available on, the Free plan.
# (The legacy key-value storage backend is Paid-only.) The SQLite-backed DO
# still exposes the ctx.storage key-value API used throughout this port.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["EvmSandbox"]

# ---------------------------------------------------------------------------
# Configuration (mirrors the Go fakereum flags/env). Override per-deployment.
# Secrets (ETHERSCAN_API_KEY) should be set with `wrangler secret put`, NOT here.
# ---------------------------------------------------------------------------
[vars]
# Upstream EVM JSON-RPC endpoint(s), comma-separated for failover. HTTP(S) only
# in the Worker port (the Go version's WebSocket upstream is replaced by fetch()).
UPSTREAM_RPC = "https://ethereum-rpc.publicnode.com"
# Upstream Etherscan v2 API base.
UPSTREAM_ETHERSCAN = "https://api.etherscan.io/v2/api"
# Sandbox chain id. 0 = derive as 420<upstreamChainID> (e.g. mainnet 1 -> 4201).
CHAIN_ID = "0"
# Native currency symbol. "" = "F" + upstream symbol (e.g. FETH).
SYMBOL = ""
# Network name. "" = "Fake " + upstream chain name.
NETWORK_NAME = ""
# eth_call / eth_estimateGas storage strategy: "stateOverride" (default; 1
# upstream call, Free-safe) or "getStorageAt" (local EVM, 1 fetch per cold
# SLOAD -- can exceed the Free 50-subrequest cap on heavy calls).
ETH_CALL_STORAGE_MODE = "stateOverride"
# Upstream-read cache TTL (seconds).
CACHE_TTL = "12"
# Replay guard: "auto" (on iff CHAIN_ID == upstream id), "true", or "false".
REJECT_UPSTREAM_SIGNERS = "auto"
# Comma-separated admin addresses; enables EIP-712 impersonation + clearSandbox.
ADMINS = ""
# Seed impersonator mappings "B:A,B2:A2" (impersonator:impersonatee).
IMPERSONATE = ""
# Comma-separated CORS origin allowlist; empty = "*".
CORS_ORIGINS = ""
# Per-IP rate limit (req/s); <=0 disables. (Go burst=100 is auto-derived here as
# 2*rps=100.)
RATE_LIMIT_RPS = "50"
# Comma-separated IPs/CIDRs (v4 or v6) that bypass the rate limit. The per-IP key
# is CF-Connecting-IP, so loopback/private entries below never match in
# production — kept for parity with the Go config.
RATE_LIMIT_EXEMPT = "127.0.0.1,::1,10.0.0.0/8"
# Genesis alloc as inline JSON (geth-style {"alloc":{...}}); "" = none.
# To run test/smoke-tx.mjs, seed the anvil account (note code:"0x" forces a
# code-less EOA, overriding any live mainnet 7702-delegation bleed-through):
#   '{"alloc":{"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266":{"balance":"0x56bc75e2d63100000","nonce":"0x0","code":"0x"}}}'
GENESIS = ""
