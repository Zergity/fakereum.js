# Cloudflare Pages project for the Robinhood Chain sandbox front door.
#
# Public URL: https://fakereum-4663.derion.io (custom domain; also
# https://fakereum-4663.pages.dev) — landing page + JSON-RPC endpoint.
# Ships the shared advanced-mode forwarder ../public/_worker.js, which hands
# every request to the EvmSandbox Durable Object defined in the companion
# Worker `fakereum-4663-rpc` (wrangler.toml [env.4663]). All sandbox config
# lives on that Worker — a DO always runs in its defining Worker's environment
# — so nothing here needs [vars].
#
# Deploy order: the Worker must be deployed FIRST (so the DO class exists —
# `npm run deploy -- 4663`), then `npm run deploy:pages -- 4663`.
name = "fakereum-4663"
pages_build_output_dir = "../public"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Cross-script Durable Object binding: the EvmSandbox class is owned by the
# `fakereum-4663-rpc` Worker; Pages binds to it by name.
[[durable_objects.bindings]]
name = "EVM_SANDBOX"
class_name = "EvmSandbox"
script_name = "fakereum-4663-rpc"
