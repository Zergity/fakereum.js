# Cloudflare Pages project for the Arbitrum sandbox front door.
#
# Public URL: https://fakereum-42161.pages.dev (landing page + JSON-RPC endpoint).
# This project ships a single advanced-mode `_worker.js` (in ./public) that
# forwards every request into the EvmSandbox Durable Object defined in the
# companion Worker `fakereum-42161-rpc`. All sandbox config (upstream RPC, chain
# id, genesis, etc.) lives on that Worker — a DO always runs in its defining
# Worker's environment — so nothing here needs the [vars].
#
# Deploy order: the Worker must be deployed FIRST (so the DO class exists),
# then `wrangler pages deploy` from this directory.
name = "fakereum-42161"
pages_build_output_dir = "public"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Cross-script Durable Object binding: the EvmSandbox class is owned by the
# `fakereum-42161-rpc` Worker; Pages binds to it by name.
[[durable_objects.bindings]]
name = "EVM_SANDBOX"
class_name = "EvmSandbox"
script_name = "fakereum-42161-rpc"
